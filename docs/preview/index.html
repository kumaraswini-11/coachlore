<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:"
    />
    <title>Coachlore preview</title>
    <style>
      /* Preview chrome (not part of the app) */
      :root {
        --chrome-bg: #111;
        --chrome-fg: #eee;
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #3a3a3a;
        font-family:
          Inter,
          "Segoe UI",
          "Nirmala UI",
          "Noto Sans Devanagari",
          system-ui,
          -apple-system,
          Roboto,
          sans-serif;
      }
      .chrome {
        position: fixed;
        inset: 0 0 auto 0;
        height: 52px;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 0 12px;
        background: var(--chrome-bg);
        color: var(--chrome-fg);
        z-index: 100;
        font-size: 13px;
        overflow-x: auto;
        white-space: nowrap;
      }
      .chrome b {
        font-weight: 600;
        margin-right: 6px;
      }
      .chrome .note {
        opacity: 0.65;
        margin-right: 8px;
      }
      .chrome button,
      .chrome select {
        background: #2a2a2a;
        color: #eee;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
      }
      .chrome button[aria-pressed="true"] {
        background: #eee;
        color: #111;
      }
      .chrome .sep {
        width: 1px;
        height: 24px;
        background: #444;
        margin: 0 4px;
        flex: none;
      }
      .stage {
        position: fixed;
        inset: 52px 0 0 0;
        display: flex;
        justify-content: center;
        align-items: stretch;
        padding: 16px;
        overflow: auto;
      }
      .frame {
        width: 100%;
        max-width: 1280px;
        height: 100%;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        flex: none;
      }
      .frame[data-size="phone"] {
        width: 360px;
      }
      .frame[data-size="tablet"] {
        width: 768px;
      }
      .frame[data-size="desktop"] {
        width: 1280px;
        max-width: 100%;
      }

      /* The app: tokens from packages/ui globals.css and spec 001 */
      .app {
        --radius: 0.45rem;
        --background: oklch(1 0 0);
        --foreground: oklch(0.145 0 0);
        --card: oklch(1 0 0);
        --primary: oklch(0.205 0 0);
        --primary-foreground: oklch(0.985 0 0);
        --secondary: oklch(0.97 0 0);
        --muted: oklch(0.97 0 0);
        --muted-foreground: oklch(0.556 0 0);
        --accent: oklch(0.97 0 0);
        --destructive: oklch(0.577 0.245 27.325);
        --border: oklch(0.922 0 0);
        --input: oklch(0.922 0 0);
        --ring: oklch(0.205 0 0);
        --success: oklch(0.52 0.13 150);
        --warning: oklch(0.55 0.13 70);
        container-type: inline-size;
        height: 100%;
        overflow: auto;
        background: var(--background);
        color: var(--foreground);
        font-size: 14px;
        line-height: 1.5;
        scroll-behavior: smooth;
        position: relative;
      }
      .app.dark {
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
        --card: oklch(0.205 0 0);
        --primary: oklch(0.922 0 0);
        --primary-foreground: oklch(0.205 0 0);
        --secondary: oklch(0.269 0 0);
        --muted: oklch(0.269 0 0);
        --muted-foreground: oklch(0.708 0 0);
        --accent: oklch(0.269 0 0);
        --destructive: oklch(0.704 0.191 22.216);
        --border: oklch(1 0 0 / 10%);
        --input: oklch(1 0 0 / 15%);
        --ring: oklch(0.922 0 0);
        --success: oklch(0.75 0.15 150);
        --warning: oklch(0.8 0.14 75);
      }
      .app.reduce *,
      .app.reduce *::before,
      .app.reduce *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
      .app svg {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .app :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      .app a {
        color: inherit;
      }
      .app h1 {
        font-size: 20px;
        margin: 0 0 4px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .app h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted-foreground);
        margin: 20px 0 8px;
        font-weight: 600;
      }
      .app h3 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
      }
      .app p {
        margin: 0 0 8px;
      }
      .muted {
        color: var(--muted-foreground);
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .small {
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      .stack > * + * {
        margin-top: 12px;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* Shell */
      .skip {
        position: absolute;
        inset-inline-start: 8px;
        top: -40px;
        z-index: 50;
        background: var(--primary);
        color: var(--primary-foreground);
        padding: 8px 12px;
        border-radius: var(--radius);
      }
      .skip:focus {
        top: 8px;
      }
      .layout {
        min-height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto 1fr auto auto;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 56px;
        padding: 0 12px;
        background: color-mix(in oklch, var(--background) 92%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        text-decoration: none;
        font-size: 16px;
      }
      .logo i {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--foreground);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2px;
        padding: 3px;
      }
      .logo i span {
        background: var(--background);
        border-radius: 1px;
      }
      .logo i span:nth-child(n + 4) {
        opacity: 0.35;
      }
      .searchbox {
        display: none;
        flex: 1;
        max-width: 520px;
        margin: 0 auto;
      }
      .main {
        padding: 16px;
        max-width: 1280px;
        width: 100%;
        margin: 0 auto;
        min-width: 0;
      }
      .draftbtn {
        position: sticky;
        bottom: 68px;
      }
      @container (min-width:1024px) {
        .draftbtn {
          bottom: 12px;
        }
      }
      .app[data-route="draft"] .tabs-bottom {
        display: none;
      }
      .tabs-bottom {
        position: sticky;
        bottom: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        background: color-mix(in oklch, var(--background) 94%, transparent);
        backdrop-filter: blur(8px);
        border-top: 1px solid var(--border);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .tabs-bottom a {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        min-height: 56px;
        font-size: 11px;
        text-decoration: none;
        color: var(--muted-foreground);
      }
      .tabs-bottom a[aria-current="page"] {
        color: var(--foreground);
        font-weight: 600;
      }
      .tabs-bottom svg,
      .side svg {
        width: 20px;
        height: 20px;
      }
      .side {
        display: none;
      }
      .footer {
        padding: 16px;
        font-size: 12px;
        color: var(--muted-foreground);
        border-top: 1px solid var(--border);
        text-align: center;
      }
      .league-tabs {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        padding: 8px 12px 0;
        border-bottom: 1px solid var(--border);
        scrollbar-width: none;
        position: sticky;
        top: 56px;
        background: var(--background);
        z-index: 15;
      }
      .league-tabs a {
        padding: 8px 12px;
        min-height: 44px;
        display: flex;
        align-items: center;
        text-decoration: none;
        color: var(--muted-foreground);
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      .league-tabs a[aria-current="page"] {
        color: var(--foreground);
        border-color: var(--foreground);
        font-weight: 600;
      }

      @container (min-width: 1024px) {
        .layout {
          grid-template-columns: 240px minmax(0, 1fr);
          grid-template-rows: auto 1fr auto;
        }
        .topbar {
          grid-column: 1 / -1;
        }
        .side {
          display: flex;
          flex-direction: column;
          gap: 2px;
          padding: 12px;
          border-inline-end: 1px solid var(--border);
          position: sticky;
          top: 56px;
          align-self: start;
          max-height: calc(100vh - 140px);
          overflow: auto;
          grid-row: 2 / 4;
        }
        .side a {
          display: flex;
          gap: 10px;
          align-items: center;
          padding: 8px 10px;
          min-height: 40px;
          border-radius: var(--radius);
          text-decoration: none;
          color: var(--muted-foreground);
        }
        .side a:hover {
          background: var(--accent);
          color: var(--foreground);
        }
        .side a[aria-current="page"] {
          background: var(--accent);
          color: var(--foreground);
          font-weight: 600;
        }
        .side .label {
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 0.06em;
          color: var(--muted-foreground);
          padding: 12px 10px 4px;
        }
        .tabs-bottom,
        .search-btn-mobile,
        .league-tabs {
          display: none;
        }
        .searchbox {
          display: block;
        }
        .main {
          padding: 24px 32px;
        }
        .footer {
          grid-column: 2;
        }
      }

      /* Components (shadcn-like) */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 16px;
        border-radius: var(--radius);
        border: 1px solid transparent;
        background: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        font-weight: 550;
        cursor: pointer;
        text-decoration: none;
        transition:
          transform 0.15s ease-out,
          opacity 0.15s;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn.outline {
        background: transparent;
        color: var(--foreground);
        border-color: var(--border);
      }
      .btn.ghost {
        background: transparent;
        color: var(--foreground);
      }
      .btn.icon {
        width: 44px;
        padding: 0;
      }
      .btn.sm {
        min-height: 36px;
        padding: 0 12px;
        font-size: 13px;
      }
      .btn[disabled] {
        background: var(--muted);
        color: var(--muted-foreground);
        border-color: var(--border);
        cursor: not-allowed;
      }
      .app a.btn {
        color: var(--primary-foreground);
      }
      .app a.btn.outline,
      .app a.btn.ghost {
        color: var(--foreground);
      }
      .app .chip,
      .app .btn,
      .app .pcard,
      .app .logo,
      .app .card {
        text-decoration: none;
      }
      .btn.danger {
        background: var(--destructive);
        color: #fff;
      }
      .input {
        width: 100%;
        min-height: 44px;
        padding-block: 0;
        padding-inline: 38px 12px;
        border-radius: var(--radius);
        border: 1px solid var(--input);
        background: transparent;
        color: inherit;
        font: inherit;
      }
      .inputwrap {
        position: relative;
      }
      .inputwrap svg {
        position: absolute;
        inset-inline-start: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        color: var(--muted-foreground);
      }
      .kbd {
        font-size: 11px;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
        color: var(--muted-foreground);
        font-family: ui-monospace, monospace;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) + 4px);
        padding: 16px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 32px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: 13px;
        background: var(--card);
        cursor: pointer;
        color: inherit;
        font: inherit;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        height: 22px;
        padding: 0 8px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .badge.neutral {
        background: var(--secondary);
        color: var(--foreground);
        text-transform: none;
        letter-spacing: 0;
        font-weight: 600;
      }
      .badge.ok {
        background: color-mix(in oklch, var(--success) 18%, transparent);
        color: var(--success);
        text-transform: none;
        letter-spacing: 0;
      }
      .badge.warn {
        background: color-mix(in oklch, var(--warning) 20%, transparent);
        color: var(--warning);
        text-transform: none;
        letter-spacing: 0;
      }
      .live {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
        color: var(--destructive);
        font-size: 12px;
      }
      .live::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      .alert {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: var(--card);
      }
      .alert.warn {
        border-color: color-mix(in oklch, var(--warning) 50%, var(--border));
      }
      .alert.err {
        border-color: color-mix(
          in oklch,
          var(--destructive) 50%,
          var(--border)
        );
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: start;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }
      th {
        font-size: 12px;
        color: var(--muted-foreground);
        font-weight: 600;
      }
      td.r,
      th.r {
        text-align: end;
      }
      tr.me td {
        background: var(--accent);
        font-weight: 600;
      }
      .skeleton {
        background: linear-gradient(
          90deg,
          var(--muted) 25%,
          color-mix(in oklch, var(--muted) 60%, var(--background)) 50%,
          var(--muted) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite linear;
        border-radius: var(--radius);
      }
      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }
      .empty {
        text-align: center;
        padding: 32px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .empty .ico {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: var(--muted);
        display: grid;
        place-items: center;
      }

      /* Pokémon art placeholder (the real app uses a small sprite; images aren't in this preview) */
      .art {
        aspect-ratio: 1;
        border-radius: calc(var(--radius) + 2px);
        display: grid;
        place-items: center;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.92);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        position: relative;
        overflow: hidden;
      }
      .art::after {
        content: "artwork";
        position: absolute;
        bottom: 4px;
        inset-inline-end: 6px;
        font-size: 9px;
        font-weight: 500;
        opacity: 0.7;
        text-shadow: none;
        color: rgba(0, 0, 0, 0.55);
      }
      .grid-cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      @container (min-width: 600px) {
        .grid-cards {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      @container (min-width: 1024px) {
        .grid-cards {
          grid-template-columns: repeat(6, 1fr);
          gap: 12px;
        }
      }
      .pcard {
        display: block;
        text-decoration: none;
        padding: 8px;
        border-radius: calc(var(--radius) + 4px);
        border: 1px solid var(--border);
        background: var(--card);
        transition:
          transform 0.15s ease-out,
          box-shadow 0.15s;
      }
      .pcard:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      }
      .pcard .art {
        font-size: 22px;
      }
      .pcard .nm {
        font-weight: 600;
        font-size: 13px;
        margin-top: 6px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pcard .types {
        display: flex;
        gap: 4px;
        margin-top: 4px;
        flex-wrap: wrap;
      }
      .pcard .types .badge {
        height: 18px;
        font-size: 9px;
        padding: 0 5px;
      }

      /* Columns */
      .cols {
        display: grid;
        gap: 16px;
        grid-template-columns: minmax(0, 1fr);
      }
      .cols > * {
        min-width: 0;
      }
      @container (min-width: 768px) {
        .cols.two {
          grid-template-columns: 1fr 1fr;
        }
      }
      .dex-filters {
        display: none;
      }
      .dex-filters.open {
        display: block;
      }
      @container (min-width: 1024px) {
        .dex-filters {
          display: block;
        }
        .cols.side-l.mon {
          grid-template-columns: 320px 1fr;
        }
        .cols.side-r {
          grid-template-columns: 1fr 320px;
        }
        .cols.side-l {
          grid-template-columns: 260px 1fr;
        }
        .cols.three {
          grid-template-columns: minmax(0, 300px) minmax(0, 1fr) 260px;
        }
      }

      /* Stats */
      .stat {
        display: grid;
        grid-template-columns: 64px 36px 1fr;
        gap: 8px;
        align-items: center;
        font-size: 13px;
      }
      .bar {
        height: 8px;
        background: var(--muted);
        border-radius: 4px;
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        border-radius: 4px;
        transition: width 0.6s ease-out;
      }
      .hero {
        border-radius: 16px;
        padding: 16px;
        position: relative;
      }
      .hero .art {
        width: min(220px, 60%);
        margin: 0 auto;
        font-size: 56px;
      }

      /* Draft room */
      .statusbar {
        position: sticky;
        top: 56px;
        z-index: 12;
      }
      @container (min-width:1024px) {
        .statusbar {
          top: 56px;
        }
      }
      .timer {
        font-size: 28px;
        font-weight: 750;
      }
      .timer.low {
        color: var(--warning);
      }
      .board td,
      .board th {
        padding: 4px 6px;
        font-size: 12px;
        text-align: center;
      }
      .board td:first-child,
      .board th:first-child {
        text-align: start;
        white-space: nowrap;
      }
      .cell {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        margin: 0 auto;
        display: grid;
        place-items: center;
        font-size: 10px;
        font-weight: 700;
        color: #fff;
      }
      .cell.empty {
        background: var(--muted);
        color: var(--muted-foreground);
      }
      .cell.now {
        outline: 2px solid var(--foreground);
        background: transparent;
        color: var(--foreground);
      }
      .poolrow {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--card);
        cursor: pointer;
        width: 100%;
        color: inherit;
        font: inherit;
        text-align: start;
      }
      .poolrow[aria-pressed="true"] {
        border-color: var(--foreground);
        box-shadow: inset 0 0 0 1px var(--foreground);
      }
      .poolrow .art {
        width: 44px;
        font-size: 14px;
        flex: none;
      }
      .poolrow .art::after {
        display: none;
      }
      .poolrow.taken {
        opacity: 0.4;
        cursor: default;
      }
      .reveal {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: color-mix(in oklch, var(--background) 60%, transparent);
        z-index: 40;
        animation: fade 0.2s ease-out;
      }
      .reveal .card {
        width: min(280px, 85%);

        shell(
          `<div class="row between"><h1>Trades</h1><button class="btn">+ New</button></div>
  <div class="cols two" style="margin-top:12px"><div class="card stack"><p class="muted small" style="margin:0">OFFER FROM GARY</p><div class="row between"><span>You give <b>Corviknight</b> (14)</span><span>You get <b>Rotom-Wash</b> (14)</span></div><p class="muted small">After: you 79/110 · Gary 92/110 · ✓ allowed · needs an admin's approval</p><div class="row"><button class="btn outline">Decline</button><button class="btn">Accept</button></div></div>
  <div class="card"><h3>History</h3><ul style="margin:8px 0 0;padding-inline-start:18px;line-height:2"><li>Lance ⇄ Erika: Dragapult for Glimmora · completed</li><li>Misty → Brock: declined</li></ul></div></div>`,
          { section: "kanto", league: true }
        )

      P.stats = () =>
        shell(
          `<h1>Stats</h1><div class="cols two" style="margin-top:12px"><div class="card" style="padding:0"><table class="num"><caption style="text-align:start;padding:12px 10px 4px;font-weight:600">KO leaders</caption><tbody>${[
            ["Tyranitar", "Ash", 11],
            ["Kingambit", "Brock", 9],
            ["Dragapult", "Lance", 8],
            ["Gyarados", "Misty", 7],
          ]
            .map(
              (r, i) =>
                `<tr><td>${i + 1}</td><td><b>${r[0]}</b> <span class="muted">(${r[1]})</span></td><td class="r">${r[2]} KO</td></tr>`
            )
            .join("")}</tbody></table></div>
  <div class="card" style="padding:0"><table class="num"><caption style="text-align:start;padding:12px 10px 4px;font-weight:600">Best differential</caption><tbody>${STAND.slice(
    0,
    4
  )
    .map(
      (s, i) =>
        `<tr><td>${i + 1}</td><td>${s[0]}</td><td class="r">+${s[3]}</td></tr>`
    )
    .join("")}</tbody></table></div></div>`,
          { section: "kanto", league: true }
        )

      P.settings = () =>
        shell(
          `<h1>Settings</h1><div class="cols side-l" style="margin-top:12px"><div class="card" style="padding:6px">${["General", "Members", "Draft", "Season", "Discord", "AI"].map((x, i) => `<div style="padding:10px;border-radius:6px;${i === 1 ? "background:var(--accent);font-weight:600" : ""}">${x}</div>`).join("")}</div>
  <div class="stack"><div class="card"><h3>Members</h3><table style="margin-top:8px"><tbody>${[
    ["Brock", "coach · admin"],
    ["Ash", "coach"],
    ["Misty", "coach"],
    ["Oak", "viewer"],
  ]
    .map(
      ([n, r]) =>
        `<tr><td>${n}</td><td class="muted">${r}</td><td class="r"><button class="btn ghost sm" aria-label="Actions for ${n}">⋯</button></td></tr>`
    )
    .join(
      ""
    )}</tbody></table><button class="btn outline" style="margin-top:12px" onclick="toast('Invitation link copied')">Copy invitation link</button></div>
  <div class="card"><h3>AI</h3>${["All AI features", "Pick suggestions in the draft room", "Recaps and the weekly digest"].map((x, i) => `<label class="row between" style="min-height:44px"><span>${x}</span><input type="checkbox" ${i !== 1 ? "checked" : ""} style="width:20px;height:20px"></label>`).join("")}<p class="muted small">With AI off, none of this league's data is sent to a model.</p></div>
  <div class="card"><h3>Discord</h3><p class="muted">Linked to #kanto-cup · <a href="#">Send a test post</a></p></div>
  <div class="card"><h3>Danger zone</h3><button class="btn danger" style="margin-top:8px">Delete league</button></div></div></div>`,
          { section: "kanto", league: true }
        )

      P.ask = () =>
        shell(
          `<div class="row between"><h1>Ask</h1><button class="btn ghost sm">New</button></div>
  <div class="stack" style="max-width:760px;margin:12px auto 0"><div class="msg me">What beats Garchomp?</div>
  <div class="trace"><div>Looked up Garchomp</div><div>Checked its matchups</div><div>Found 6 Ice-type options in the data</div></div>
  <div class="card"><p>Garchomp takes ×4 from Ice. Good answers:</p><div class="row">${["weavile", "mamoswine", "baxcalibur"].map((k) => `<a class="chip" href="#/dex/${k}">${byKey[k].name}</a>`).join("")}</div></div>
  <p class="muted small">✦ Written by AI from the Dex's data · 16 of 20 left today</p>
  <div class="inputwrap" style="position:sticky;bottom:64px"><input class="input" style="padding-inline-start:12px" placeholder="Ask a follow-up…" aria-label="Ask a follow-up"></div>
  <div class="wire-note">Spec 012 · an answer appears only after its lookups and the grounding check; every named Pokémon, move or ability is checked against the data.</div></div>`,
          { section: "ask" }
        )

      P.me = () =>
        shell(
          `<div class="row"><span style="width:56px;height:56px;border-radius:50%;background:var(--muted);display:grid;place-items:center;font-weight:700">A</span><div><h1>Ash</h1><p class="muted small" style="margin:0">Signed in with Discord</p></div></div>
  <div class="cols two" style="margin-top:16px"><div class="card"><h3>Your leagues</h3><p>Kanto Cup · coach</p><p>Friday Cup · coach, admin</p></div>
  <div class="card stack"><h3>Your data</h3><p class="muted">We keep your Discord ID, name and avatar, and what you do in your leagues.</p><div class="row"><button class="btn outline">Download my data</button><button class="btn danger">Delete my account</button></div><p class="muted small">AI today: 4 of 20 used.</p><button class="btn ghost">Sign out</button></div></div>`,
          { section: "me" }
        )

      P.signin = () =>
        shell(
          `<div class="card stack" style="max-width:420px;margin:24px auto;text-align:center"><h1>Sign in</h1><p class="muted">Leagues use your Discord account. We keep your Discord ID, name and avatar, nothing else.</p><button class="btn" style="width:100%">Continue with Discord</button><p class="muted small">The Dex needs no account.</p></div>`,
          {}
        )

      P.about = () =>
        shell(
          `<div style="max-width:680px"><h1>About</h1><p>Coachlore is a fan-made Pokédex and a home for Pokémon draft leagues, free and non-commercial.</p><h2>Credits</h2><p class="muted">Data: PokéAPI and Pokémon Showdown's data. Usage statistics: Smogon. Images © The Pokémon Company.</p><h2>Not affiliated</h2><p class="muted">Coachlore is not affiliated with Nintendo, Creatures, Game Freak or The Pokémon Company.</p></div>`,
          {}
        )

      P.states = () =>
        shell(
          `<h1>Every state</h1><p class="muted">Spec 001: a view isn't done until it has every state that applies to it.</p>
  <div class="cols two" style="margin-top:12px">
   <div class="card"><h3>Loading</h3><div class="grid-cards" style="margin-top:8px">${Array.from({ length: 6 }, () => `<div><div class="skeleton" style="aspect-ratio:1"></div><div class="skeleton" style="height:12px;margin-top:6px"></div></div>`).join("")}</div></div>
   <div class="card"><h3>Empty</h3><div class="empty"><div class="ico">⌀</div><b>No leagues yet</b><p class="muted">Create one, or open an invitation link from a friend.</p><a class="btn" href="#/leagues/new">Create a league</a></div></div>
   <div class="card" role="alert"><h3>Error</h3><div class="empty"><b>This page couldn’t load</b><p class="muted">Try again. If it keeps happening, come back later. (Error reference: 8f3a2c)</p><button class="btn">Try again</button></div></div>
   <div class="card"><h3>Offline</h3><div class="alert warn">⚠ <div><b>You're offline.</b> <span class="muted">The Dex pages you've opened still work; changes are off until you're back.</span></div></div></div>
   <div class="card"><h3>No permission</h3><div class="empty"><b>This league is private</b><p class="muted">Ask an admin for an invitation link.</p></div></div>
   <div class="card"><h3>AI unavailable</h3><div class="alert">✦ <div><b>Today's AI allowance is used.</b> <span class="muted">It resets at midnight UTC. Everything else works.</span></div></div></div>
   <div class="card"><h3>Reconnecting (draft room)</h3><div class="alert warn">↻ <div><b>Reconnecting…</b> <span class="muted">Picking is off until the room has caught up with the server.</span></div></div></div>
   <div class="card"><h3>Not found</h3><div class="empty"><b>Page not found</b><p class="muted">There's no page at this address.</p><a class="btn outline" href="#/">Go to the home page</a></div></div>
  </div>`,
          {}
        )

      P.notfound = () =>
        shell(
          `<div class="empty" style="min-height:50vh"><h1>Page not found</h1><p class="muted">There's no page at this address. Check the link, or start again from the home page.</p><a class="btn" href="#/">Go to the home page</a></div>`,
          {}
        )

      // ---------- Router ----------
      const ROUTES = [
        ["#/", "Home", P.home],
        ["#/dex", "Dex: browse", P.dex],
        ["#/dex/garchomp", "A Pokémon: Garchomp", () => P.mon("garchomp")],
        ["#/dex/rotom-wash", "A form: Rotom-Wash", () => P.mon("rotom-wash")],
        ["#/types", "Type chart", P.types],
        ["#/moves", "Moves", P.moves],
        ["#/team-check", "Team check", P.team],
        ["#/leagues", "Leagues", P.leagues],
        ["#/leagues/new", "Create a league", P.newLeague],
        ["#/l/kanto-cup", "League home", P.leagueHome],
        ["#/l/kanto-cup/tiers", "Tier list", P.tiers],
        ["#/l/kanto-cup/draft", "Draft room (live)", P.draft],
        ["#/l/kanto-cup/rosters/ash", "A coach's roster", P.coach],
        ["#/l/kanto-cup/schedule", "Schedule", P.schedule],
        ["#/l/kanto-cup/matches/5", "A match", P.match],
        ["#/l/kanto-cup/trades", "Trades", P.trades],
        ["#/l/kanto-cup/stats", "Stats", P.stats],
        ["#/l/kanto-cup/settings", "League settings", P.settings],
        ["#/ask", "Ask (AI)", P.ask],
        ["#/me", "Me", P.me],
        ["#/sign-in", "Sign in", P.signin],
        ["#/about", "About", P.about],
        ["#/states", "Every state", P.states],
        ["#/nowhere", "Not found", P.notfound],
      ]
      function render() {
        const h = location.hash || "#/"
        let page = P.notfound
        const m = h.match(/^#\/dex\/([\w-]+)$/)
        if (m) page = () => P.mon(m[1])
        else {
          const r = ROUTES.find(
            ([p]) =>
              p === h.replace(/\/$/, "") ||
              (p === "#/" && (h === "#/" || h === "#" || h === ""))
          )
          if (r) page = r[2]
          if (h.startsWith("#/l/kanto-cup/rosters")) page = P.coach
          if (h.startsWith("#/l/kanto-cup/matches")) page = P.match
          if (h === "#/l/friday-cup") page = P.leagueHome
        }
        const keepScroll = app.scrollTop
        const same = render.last === h
        app.innerHTML = page()
        app.lang = S.lang
        app.dataset.route = h.startsWith("#/l/kanto-cup/draft") ? "draft" : ""
        app.dir = S.rtl ? "rtl" : "ltr"
        app.classList.toggle("dark", S.dark)
        app.classList.toggle("reduce", S.reduce)
        if (same) app.scrollTop = keepScroll
        else app.scrollTop = 0
        render.last = h
        $("#jump").value = ROUTES.find(([p]) => p === h)?.[0] || ""
      }
      addEventListener("hashchange", () => {
        S.menu = false
        S.palette = false
        render()
      })
      addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
          e.preventDefault()
          S.palette ? closePalette() : openPalette()
          return
        }
        const typing =
          /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) ||
          S.palette
        if (
          typing ||
          !S.hotkeys ||
          e.ctrlKey ||
          e.metaKey ||
          e.altKey ||
          e.repeat
        ) {
          if (e.key === "Escape" && S.menu) {
            S.menu = false
            render()
          }
          return
        }
        if (e.key === "/") {
          e.preventDefault()
          openPalette()
        }
        if (e.key.toLowerCase() === "d") setDark(!S.dark)
        if (e.key === "Escape" && S.menu) {
          S.menu = false
          render()
        }
      })

      // ---------- Preview chrome ----------
      const jump = $("#jump")
      jump.innerHTML =
        `<option value="">Go to screen…</option>` +
        ROUTES.map(([p, l]) => `<option value="${p}">${l}</option>`).join("")
      jump.onchange = () => {
        if (jump.value) location.hash = jump.value.slice(1)
      }
      document.querySelectorAll(".chrome [data-size]").forEach(
        (b) =>
          (b.onclick = () => {
            $("#frame").dataset.size = b.dataset.size
            document
              .querySelectorAll(".chrome [data-size]")
              .forEach((x) => x.setAttribute("aria-pressed", x === b))
          })
      )
      $("#themeBtn").onclick = () => setDark(!S.dark)
      $("#langBtn").onclick = () => {
        S.lang = S.lang === "en" ? "hi" : "en"
        syncChrome()
        render()
      }
      $("#rtlBtn").onclick = () => {
        S.rtl = !S.rtl
        $("#rtlBtn").setAttribute("aria-pressed", S.rtl)
        render()
      }
      $("#motionBtn").onclick = () => {
        S.reduce = !S.reduce
        $("#motionBtn").setAttribute("aria-pressed", S.reduce)
        render()
      }
      function syncChrome() {
        $("#themeBtn").textContent = S.dark ? "Light theme" : "Dark theme"
        $("#langBtn").textContent = S.lang === "en" ? "हिन्दी" : "English"
        $("#langBtn").setAttribute("aria-pressed", S.lang === "hi")
      }
      if (matchMedia("(max-width: 700px)").matches) {
        $("#frame").dataset.size = "phone"
      }
      render()
    </script>
  </body>
</html>
