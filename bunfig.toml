# Bun's settings for this repository: https://bun.com/docs/runtime/bunfig

[install]
# `bun add` writes an exact version, not a caret range; versions shared by
# packages still go in the workspace catalog (AGENTS.md, "Versions").
exact = true

# When Bun picks a version from a range, it skips versions published less
# than 14 days (in seconds) ago, as AGENTS.md ("Versions") requires. A version
# requested exactly (`bun add name@1.2.3`) is installed whatever its age, so
# check its date before pinning it.
minimumReleaseAge = 1209600

# Security fixes younger than 14 days, each with its reason (ADR 0002,
# "Consequences"). Bun 1.3.8 takes package names only (the `name@version`
# form came in a later release), so every package listed must also be pinned
# exactly, which keeps any other version out.
minimumReleaseAgeExcludes = [
  # Next.js 16.4.1 (2026-10-14) fixes GHSA-673q-mjm6-r5xr (RCE in `use cache`
  # functions), GHSA-2464-fhr4-w9xw (RCE in the image optimizer with SVGs)
  # and GHSA-p3m5-59mp-jv5r (DoS through Server Actions); 16.4.0 is affected.
  # `next` is pinned exactly in apps/web, and pins these @next/* packages to
  # its own version. Remove these entries from 2026-10-28, when 16.4.1 is 14
  # days old.
  "next",
  "@next/env",
  "@next/swc-darwin-arm64",
  "@next/swc-darwin-x64",
  "@next/swc-linux-arm64-gnu",
  "@next/swc-linux-arm64-musl",
  "@next/swc-linux-x64-gnu",
  "@next/swc-linux-x64-musl",
  "@next/swc-win32-arm64-msvc",
  "@next/swc-win32-x64-msvc",
]
