<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Coachlore's mark, the Playbook: an open book (the lore) with one play
       drawn across it (the coach). Chosen by the owner on 2026-10-21 from
       docs/preview/coachlore-logo-concepts.html. -->
  <style>
    .tile { fill: #0a0a0a }
    .mark { stroke: #ffffff }
    .dot { fill: #ffffff }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #ffffff }
      .mark { stroke: #0a0a0a }
      .dot { fill: #0a0a0a }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7" />
  <g transform="translate(4 4)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="mark" stroke-width="2" d="M12 6.25C9.75 4.75 6.75 4.25 2.75 4.5v14c4-.25 7 .25 9.25 1.75 2.25-1.5 5.25-2 9.25-1.75v-14c-4-.25-7 .25-9.25 1.75z" />
    <path class="mark" stroke-width="1.75" d="M7.25 14.25C9 10 14 9.25 16.5 11.75" />
    <path class="mark" stroke-width="1.75" d="M14 11.5 16.75 12 17 9.25" />
    <circle class="dot" cx="6.5" cy="15" r="1.5" />
  </g>
</svg>
