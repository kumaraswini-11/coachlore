<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Draftboard's mark: a draft board, three picks in. A placeholder until
       the design is chosen. -->
  <style>
    .board { fill: #0a0a0a }
    .pick { fill: #ffffff }
    .open { fill: #ffffff; opacity: 0.3 }
    @media (prefers-color-scheme: dark) {
      .board { fill: #ffffff }
      .pick { fill: #0a0a0a }
      .open { fill: #0a0a0a }
    }
  </style>
  <rect class="board" width="32" height="32" rx="7" />
  <rect class="pick" x="6" y="6" width="5" height="5" rx="1" />
  <rect class="pick" x="13.5" y="6" width="5" height="5" rx="1" />
  <rect class="pick" x="21" y="6" width="5" height="5" rx="1" />
  <rect class="open" x="6" y="13.5" width="5" height="5" rx="1" />
  <rect class="open" x="13.5" y="13.5" width="5" height="5" rx="1" />
  <rect class="open" x="21" y="13.5" width="5" height="5" rx="1" />
  <rect class="open" x="6" y="21" width="5" height="5" rx="1" />
  <rect class="open" x="13.5" y="21" width="5" height="5" rx="1" />
  <rect class="open" x="21" y="21" width="5" height="5" rx="1" />
</svg>
