# The checks in AGENTS.md ("Commands"), and the identity check in
# docs/git-workflow.md, on every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, format and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node.js runs Next.js; the version comes from `engines.node`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      # Bun's version comes from `packageManager` in package.json.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      # Known advisories in the lockfile, high and critical. Ignored, each with
      # its reason and a date to look again:
      # - GHSA-vfj7-8cjw-p6xm (braces, CVE-2026-93687): no patched release;
      #   reached only through the shadcn CLI and eslint-config-next, with
      #   patterns from this repository's own config, never from users.
      #   Review on 2026-11-21. (bun audit matches the GHSA ID, not the CVE.)
      - run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run format:check
      - run: bun run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      # The browsers the tests run in, with their system libraries.
      - run: bunx playwright install --with-deps chromium webkit
        working-directory: packages/playwright-web

      # Builds the web app, then runs the tests against it (turbo.json).
      - run: bun run e2e

  identity:
    name: Commit identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every new commit carries the owner's identity
        env:
          EXPECTED: kumaraswini.11.11@gmail.com
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          wrong=$(git log --format='%h %ae %ce' "$range" | awk -v e="$EXPECTED" '$2 != e || $3 != e')
          if [ -n "$wrong" ]; then
            echo "Commits with another author or committer email:"
            echo "$wrong"
            exit 1
          fi
          echo "Every commit in $range is $EXPECTED."
