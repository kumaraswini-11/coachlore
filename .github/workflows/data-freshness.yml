# Once a month, checks whether newer Pokémon data is available than
# packages/dex/sources.json pins (ADR 0009) and, if so, opens an issue (or
# updates the open one) saying what's newer and how to refresh. It never
# commits: a data refresh is the owner's own commit (docs/git-workflow.md,
# "No bot pull requests").
name: Data freshness

on:
  schedule:
    # The 16th, past the hour's start (GitHub delays scheduled runs then):
    # by then Smogon's last month has been out more than two weeks.
    - cron: "17 6 16 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: Newer data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bun's version comes from `packageManager` in package.json. The
      # script uses Node's own modules only, so nothing is installed.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Compare the pins with the newest sources
        run: bun packages/dex/scripts/update-pins.ts --check > "$RUNNER_TEMP/body.md"

      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Newer Pokémon data is available
        run: |
          body="$RUNNER_TEMP/body.md"
          if [ ! -s "$body" ]; then
            echo "Every pin is already the newest."
            exit 0
          fi
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$body"
            echo "Updated issue #$number."
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi
